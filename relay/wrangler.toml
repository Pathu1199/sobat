# Sobat's reminder relay. Deploy with: npm run deploy (after `npx wrangler login`).
name = "sobat-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Every five minutes: send whatever became due since the last run.
[triggers]
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "SUBS"
id = "REPLACE_WITH_KV_ID"

[vars]
VAPID_SUBJECT = "mailto:design3@varadautomation.com"
