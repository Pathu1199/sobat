# Sobat's reminder relay. Deploy with: npm run deploy (after `npx wrangler login`).
name = "sobat-relay"
main = "src/index.ts"
compatibility_date = "2025-09-01"

# Every five minutes: send whatever became due since the last run.
[triggers]
crons = ["*/5 * * * *"]

# Push subscriptions and their reminder times, one entry per phone.
[[kv_namespaces]]
binding = "SUBS"
id = "REPLACE_WITH_KV_ID"

# The account directory: one small entry per signed-in person (who, when last
# seen, blocked or not). The data itself is in Google Drive, not here.
# Create with: npx wrangler kv namespace create USERS
[[kv_namespaces]]
binding = "USERS"
id = "REPLACE_WITH_USERS_KV_ID"

[vars]
VAPID_SUBJECT = "mailto:design3@varadautomation.com"
VAPID_PUBLIC_KEY = "BCwCri232dn5dL8BgxWj2BeTE5v-N7GSpEX1TgKns8nzwk3zPpN4Z0XWKK_U4Qx0EIRdUVt3849xMbefS9LcjMA"
ALLOWED_ORIGINS = "https://sobat-a56c7.web.app,http://localhost:8082"
# Only this account may list, block or delete other accounts. Must match the app's ADMIN_EMAIL.
ADMIN_EMAIL = "shindeprathmesh999@gmail.com"
# The Firebase web API key (public by design); used to ask Firebase who a token belongs to.
FIREBASE_API_KEY = "AIzaSyB3Q628mgS6-s_vSOsmAEEsNmu9gJXwBGs"
# The folder in the app maker's Drive that holds one <uid>.json per account.
DRIVE_FOLDER = "Sobat"

# Secrets, each set with `npx wrangler secret put <NAME>`:
#   VAPID_PRIVATE_KEY      from ~/.sobat/vapid.json
#   GOOGLE_CLIENT_ID       the OAuth client made for the relay (see README)
#   GOOGLE_CLIENT_SECRET
#   GOOGLE_REFRESH_TOKEN   printed by: node scripts/connect-drive.mjs
