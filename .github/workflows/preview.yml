# Every pull request gets its own temporary Firebase link, posted as a
# comment on the PR, so a change can be tried before it reaches main.
name: Preview on Firebase

on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  preview:
    name: Test, build and preview
    # Pull requests from forks cannot read the deploy secret.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:web
      - name: Check the Firebase deploy key is set
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOBAT_A56C7 }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The FIREBASE_SERVICE_ACCOUNT_SOBAT_A56C7 secret is missing. Run 'firebase init hosting:github' in the project folder, choose Pathu1199/sobat, then re-run this workflow."
            exit 1
          fi
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOBAT_A56C7 }}
          projectId: sobat-a56c7
          expires: 7d
