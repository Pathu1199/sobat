# Every push to main is checked, built and put live on Firebase Hosting.
# Each run shows under Actions, and each release under Deployments → production.
name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push replaces a deploy still waiting, never one already running.
concurrency:
  group: firebase-live
  cancel-in-progress: false

permissions:
  contents: write
  checks: write

jobs:
  check:
    name: Test, lint, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck

  apk:
    name: Build signed APK
    needs: check
    runs-on: ubuntu-latest
    steps:
      # Without the key there is nothing safe to publish: a debug-signed APK
      # could not update a release-signed one. So the job skips, with a warning,
      # rather than failing the whole run while the website deploys fine.
      - name: Check the signing key is set
        id: key
        env:
          KEY: ${{ secrets.SOBAT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::APK not built: the SOBAT_RELEASE_KEYSTORE_BASE64 secret is missing. Add the four SOBAT_RELEASE_* secrets (see SETUP.md, Rebuilding the APK) and this job will sign and publish on the next push."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v7
      - if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - if: steps.key.outputs.present == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - if: steps.key.outputs.present == 'true'
        run: npm ci
      - if: steps.key.outputs.present == 'true'
        name: Write the signing key
        env:
          KEY: ${{ secrets.SOBAT_RELEASE_KEYSTORE_BASE64 }}
        run: echo "$KEY" | base64 -d > "$RUNNER_TEMP/sobat-release.keystore"
      # The android folder is generated; the signing config comes from plugins/withReleaseSigning.js.
      - if: steps.key.outputs.present == 'true'
        run: npx expo prebuild -p android --no-install
      - if: steps.key.outputs.present == 'true'
        name: Build the release APK
        working-directory: android
        env:
          SOBAT_RELEASE_KEY_ALIAS: ${{ secrets.SOBAT_RELEASE_KEY_ALIAS }}
          SOBAT_RELEASE_STORE_PASSWORD: ${{ secrets.SOBAT_RELEASE_STORE_PASSWORD }}
          SOBAT_RELEASE_KEY_PASSWORD: ${{ secrets.SOBAT_RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PreactNativeArchitectures=arm64-v8a \
            -PSOBAT_RELEASE_STORE_FILE="$RUNNER_TEMP/sobat-release.keystore" \
            -PSOBAT_RELEASE_KEY_ALIAS="$SOBAT_RELEASE_KEY_ALIAS" \
            -PSOBAT_RELEASE_STORE_PASSWORD="$SOBAT_RELEASE_STORE_PASSWORD" \
            -PSOBAT_RELEASE_KEY_PASSWORD="$SOBAT_RELEASE_KEY_PASSWORD"
      - if: steps.key.outputs.present == 'true'
        run: cp android/app/build/outputs/apk/release/app-release.apk sobat.apk
      # The site links to releases/latest/download/sobat.apk, so each build is a release.
      - if: steps.key.outputs.present == 'true'
        name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: build-${{ github.run_number }}
          name: Sobat build ${{ github.run_number }}
          body: Automatic build of ${{ github.sha }}. Android 8+, arm64, signed with Sobat's release key.
          files: sobat.apk
          make_latest: true

  deploy:
    name: Build and deploy
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sobat-a56c7.web.app
    steps:
      - name: Check the Firebase deploy key is set
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOBAT_A56C7 }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The FIREBASE_SERVICE_ACCOUNT_SOBAT_A56C7 secret is missing. Run 'firebase init hosting:github' in the project folder, choose Pathu1199/sobat, then re-run this workflow."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SOBAT_A56C7 }}
          projectId: sobat-a56c7
          channelId: live
